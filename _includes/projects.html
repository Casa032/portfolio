<section id="projects">
    <h2>Projects</h2>

    <div class="projects-list">
        {% for project in site.projects %}
        <a href="{{ project.url | relative_url }}" class="project">
            <h3>{{ project.title }}</h3>
            <p class="project-tech">{{ project.tech }}</p>
            <p>{{ project.excerpt }}</p>
            <p class="btn_proj"> Voir le détail</p>
        </a>
        {% endfor %}
    </div>
</section>
