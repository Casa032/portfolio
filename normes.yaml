# ============================================================
# GRILLE DES NORMES D'ARBORESCENCE — DATA SCIENCE
# ============================================================
# Ce fichier est la SEULE chose à modifier pour ajuster les règles.
# Le script (audit_arborescence.py) ne contient aucune règle en dur,
# il ne fait que lire et appliquer ce qui est écrit ici.
#
# Structure générale :
#   commun   -> s'applique à TOUS les projets, quel que soit le sujet
#   sujets   -> règles ADDITIONNELLES selon le sujet (finance, marketing, ia...)
#               (elles s'ajoutent au commun, elles ne le remplacent pas)
# ============================================================

commun:
  fichiers_obligatoires:
    - README.md
    - requirements.txt
  dossiers_obligatoires:
    - src
  fichiers_recommandes:      # signalés en avertissement, mais projet reste conforme
    - .gitignore
  patterns_interdits:        # jamais présents, où que ce soit dans le projet
    - "__pycache__"
    - "*.pyc"
    - ".ipynb_checkpoints"

sujets:

  finance:
    fichiers_obligatoires: []
    dossiers_obligatoires:
      - data
      - models
      - backtesting
    sous_structure:                # contraintes A L'INTERIEUR d'un dossier
      data:
        dossiers_obligatoires:
          - raw
          - processed

  marketing:
    fichiers_obligatoires: []
    dossiers_obligatoires:
      - data
      - reports
    sous_structure: {}

  ia:
    fichiers_obligatoires: []
    dossiers_obligatoires:
      - data
      - notebooks
      - models
      - config
    sous_structure:
      data:
        dossiers_obligatoires:
          - raw
          - processed

# ============================================================
# Comment un projet déclare son sujet :
# on lit un petit fichier texte ".sujet" à la racine du projet,
# qui contient juste le mot-clé : finance / marketing / ia
# (voir fonction detecter_sujet dans le script)
# ============================================================
